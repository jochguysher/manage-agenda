# Pre-commit hook for manage-agenda: ruff only.
# Install with: .venv/bin/pre-commit install
#
# ruff covers what black/isort used to do here (the "I" rule set sorts imports, and the
# repo's CI runs the same `ruff check`, see .github/workflows/test.yml). The version is the
# one pinned in uv.lock, so the hook, the CI and a local `ruff check` agree on the rules.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check  # `ruff` is only a legacy alias of this id since ruff-pre-commit 0.12
        args: ['--fix', '--exit-non-zero-on-fix']

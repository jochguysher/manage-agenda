name: Test

on:
  push:
  pull_request:
  workflow_dispatch:  # lets `gh workflow run test.yml` start lint+test without a push

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      # Same version as uv.lock, so CI and `ruff check` locally agree on the rule set.
      run: pip install ruff==0.16.8
    - name: ruff check
      run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        pip install '.[test]'
    - name: Run tests
      # Without the 'gui' extra, tests/gui is skipped as a whole (pytest.importorskip).
      run: |
        python -m pytest

  test-gui:
    # The desktop window against Qt's offscreen platform: PySide6 needs a few system
    # libraries even without a display.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install Qt runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
    - name: Install dependencies
      run: |
        pip install '.[test,gui]'
    - name: Run the GUI tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests/gui --no-cov

